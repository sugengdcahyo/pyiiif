version: "3.9"

services:
  iiif:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iiif-service
    ports:
      - "5050:5050"
    env_file:
      - .env
    command: >
      sh -c "gunicorn -w ${GUNICORN_WORKERS:-2} -k gthread --threads ${GUNICORN_THREADS:-2} -b 0.0.0.0:5050 wsgi:app --timeout 120"
    volumes:
      # bind slides folder dari host ke container
      - ./slides:/app/slides:ro
    environment:
      # opsional, sesuaikan kebutuhan Flask/Gunicorn
      - PORT=5050
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
